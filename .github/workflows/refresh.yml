# Weekly refresh: pull new EIA, weather, DPU GAF/LDAF, company and NYMEX futures data, rerun
# backtests and forecasts,
# commit data/ so the Streamlit app updates and the next run starts from
# the saved history (weather is then refreshed incrementally).
# Setup: repo Settings -> Secrets and variables -> Actions -> New secret EIA_API_KEY
name: Weekly data refresh

on:
  schedule:
    - cron: "17 14 * * 5"   # Fridays 14:17 UTC, after Thursday's storage report
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commits          # shared with nymex-daily.yml so the two never push at once
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-pipeline.txt
      - run: pytest -q tests/
      - run: python -m src.pipeline --pull
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      - name: Commit refreshed outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw data/processed
          git diff --cached --quiet || git commit -m "Weekly data refresh"
          git pull --rebase origin main
          git push
