# Weekly refresh: pull new EIA + weather data, rerun backtests and forecasts,
# commit data/processed/ so the Streamlit app updates itself.
# Setup: repo Settings -> Secrets and variables -> Actions -> New secret EIA_API_KEY
name: Weekly data refresh

on:
  schedule:
    - cron: "17 14 * * 5"   # Fridays 14:17 UTC, after Thursday's storage report
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-pipeline.txt
      - run: pytest -q tests/
      - run: python -m src.pipeline --pull
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      - name: Commit refreshed outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed
          git diff --cached --quiet || git commit -m "Weekly data refresh"
          git push
